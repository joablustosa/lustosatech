# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Auth: publish profile (nao depende de federated identity OIDC).
# Secret necessario no repo lustosa-tech/lustosatech:
#   AZURE_WEBAPP_PUBLISH_PROFILE
# Como obter: Azure Portal → App Service "LustosaWhatsapp" →
#   Download publish profile → colar no secret acima.

name: Build and deploy Node.js app to Azure Web App - LustosaWhatsapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: npm install and build
        run: |
          npm ci
          npx prisma generate
          npm run build
        env:
          DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
          AUTH_SECRET: build-time-placeholder-secret
          NEXT_PUBLIC_BASE_URL: https://lustosawhatsapp-cfaedzbtg9fubadx.canadacentral-01.azurewebsites.net

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          include-hidden-files: true
          path: |
            .
            !node_modules
            !.git
            !.next/cache

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: LustosaWhatsapp
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
