# Build e deploy da app Next.js para o Azure Web App - LustosaWhatsapp
# Autenticação via Perfil de Publicação (secret AZURE_WEBAPP_PUBLISH_PROFILE).

name: Build and deploy Node.js app to Azure Web App - LustosaWhatsapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
        env:
          # prisma generate e next build não precisam de banco real,
          # mas mantemos as variáveis disponíveis caso necessário.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXT_PUBLIC_BASE_URL: https://lustosawhatsapp-cfaedzbtg9fubadx.canadacentral-01.azurewebsites.net

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: LustosaWhatsapp
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
